# Replace YOUR-API.onrender.com with your Render URL. Proxying /api makes the session cookie first-party,
# which is required for Safari/iOS (they block cookies sent between different websites).
[[redirects]]
  from = "/api/*"
  to = "https://q-flow-mcfh.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/socket.io/*"
  to = "https://q-flow-mcfh.onrender.com/socket.io/:splat"
  status = 200
  force = true
